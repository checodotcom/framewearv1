<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>panoramica</title>
  <link rel="icon" type="image/png" href="assets/images/PanoramicaCorto.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <h1 class="wordmark" id="site-title"></h1>
      <div class="nav-trigger-wrap header-trigger">
        <button class="nav-trigger" id="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav-dropdown">
          <img class="nav-trigger-img" id="brand-logo" src="assets/images/PanoramicaCorto.png" alt="">
          <span class="sr-only">Menu</span>
        </button>
        <nav class="dropdown-nav" id="site-nav-dropdown">
          <a href="index.html" class="nav-link">home</a>
          <a href="products.html" class="nav-link">products</a>
          <a href="#" class="nav-link">about</a>
          <a href="#" class="nav-link">contact</a>
        </nav>
      </div>
    </header>

    <main class="products-main">
      <div class="carousel" id="carousel">
        <button class="carousel-arrow carousel-arrow--prev" id="carousel-prev" type="button" aria-label="Previous product">
          <span class="carousel-arrow-icon"></span>
        </button>

        <div class="carousel-track" id="carousel-track">
          <div class="carousel-item" data-index="0">
            <img src="" alt="">
          </div>
          <div class="carousel-item" data-index="1">
            <img src="" alt="">
          </div>
          <div class="carousel-item" data-index="2">
            <img src="" alt="">
          </div>
        </div>

        <button class="carousel-arrow carousel-arrow--next" id="carousel-next" type="button" aria-label="Next product">
          <span class="carousel-arrow-icon"></span>
        </button>
      </div>

      <div class="price-row">
        <span class="price" id="product-price"></span>
        <button class="buy-btn" type="button" id="buy-btn">
          <span class="buy-btn-label" id="buy-btn-label">Sold out</span>
        </button>
      </div>
      <div class="size-select">
        <button class="more-btn" id="size-toggle" type="button" aria-expanded="false" aria-controls="size-dropdown">sizes</button>
        <ul class="size-dropdown" id="size-dropdown"></ul>
      </div>
      <div class="info-select">
        <button class="more-btn" id="info-toggle" type="button" aria-expanded="false" aria-controls="info-dropdown">more</button>
        <div class="info-dropdown" id="info-dropdown">
          <p class="info-title" id="info-title"></p>
          <p class="info-description" id="info-description"></p>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <p class="footer-text" id="footer-text"></p>
    </footer>
  </div>

  <script src="js/common.js" defer></script>
  <script src="js/products.js" defer></script>
</body>
</html>
